name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Search checks
        run: |
          mkdir -p /tmp/ifsc-search-test
          javac -d /tmp/ifsc-search-test app/src/main/java/com/bhuvancom/bank_pie/Search.java tools/SearchTest.java
          java -cp /tmp/ifsc-search-test SearchTest
      - run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bank-Pie-debug
          path: app/build/outputs/apk/debug/*.apk
